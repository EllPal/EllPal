body{margin:0}
a{color:#86C5FF}a:hover{color:#FFFFFF}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}

.tg{background:linear-gradient(180deg,#FFFFFF 25%,#9A9DA7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

.twinkle{animation:twinkle 4s ease-in-out infinite both}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
.breathe{animation:breathe 8s ease-in-out infinite}

.gborder{position:relative;isolation:isolate}
.gborder::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),rgba(255,255,255,.07) 0deg,rgba(255,255,255,.07) 200deg,#86C5FF 260deg,#AF7DFF 300deg,rgba(255,255,255,.07) 345deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite;pointer-events:none;z-index:2}
.planet{position:absolute;border-radius:50%;overflow:hidden;background:#0C0D11;box-shadow:0 -40px 120px -30px rgba(55,191,239,.6),0 -16px 70px -24px rgba(119,58,237,.65)}
.planet::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;background:conic-gradient(from var(--a),rgba(134,197,255,.08) 0deg,rgba(134,197,255,.08) 300deg,#86C5FF 330deg,#FFFFFF 340deg,#AF7DFF 350deg,rgba(134,197,255,.08) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 12s linear infinite;z-index:3}
.planet::after{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;background:linear-gradient(180deg,rgba(190,220,255,.95) 0%,rgba(175,125,255,.45) 5%,transparent 12%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:3}
.planet-spin{animation:spinT 200s linear infinite}
.rise-planet{animation:risePlanet 2.8s cubic-bezier(.16,1,.3,1) .2s both}
@keyframes risePlanet{from{transform:translateY(18%);opacity:0}}
.petal-d{animation:petalD 7.2s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes petalD{0%,100%{opacity:.16}9%{opacity:.62}34%{opacity:.28}}
@media (prefers-reduced-motion: reduce){.m3 *,.m3 *::before,.m3 *::after{animation:none!important}}
