<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
a{color:#86C5FF}a:hover{color:#FFFFFF}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.tg{background:linear-gradient(180deg,#FFFFFF 25%,#9A9DA7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg2{background:linear-gradient(90deg,#86C5FF 0%,#AF7DFF 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.shimmer{background:linear-gradient(90deg,#A3A6AF 0%,#A3A6AF 35%,#FFFFFF 50%,#A3A6AF 65%,#A3A6AF 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3.2s linear infinite}
@keyframes shimmer{from{background-position:125% 0}to{background-position:-125% 0}}
.blur-in{display:inline-block;animation:blurIn 1.4s cubic-bezier(.16,1,.3,1) both}
@keyframes blurIn{from{opacity:0;filter:blur(14px);transform:translateY(18px)}}
.twinkle{animation:twinkle 4s ease-in-out infinite both}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.gborder{position:relative;isolation:isolate}
.gborder::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),rgba(255,255,255,.07) 0deg,rgba(255,255,255,.07) 200deg,#86C5FF 260deg,#AF7DFF 300deg,rgba(255,255,255,.07) 345deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none;z-index:2}
.eclipse{position:absolute;border-radius:50%;background:#0B0C0F;box-shadow:0 -40px 120px -30px rgba(55,191,239,.6),0 -16px 70px -24px rgba(119,58,237,.65),inset 0 50px 100px -50px rgba(55,191,239,.35)}
.eclipse::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;background:conic-gradient(from var(--a),rgba(134,197,255,.08) 0deg,rgba(134,197,255,.08) 300deg,#86C5FF 330deg,#FFFFFF 340deg,#AF7DFF 350deg,rgba(134,197,255,.08) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 12s linear infinite}
.eclipse::after{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;background:linear-gradient(180deg,rgba(180,215,255,.95) 0%,rgba(175,125,255,.45) 6%,transparent 16%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.6);box-shadow:0 0 24px rgba(55,191,239,.95)}}
@media (prefers-reduced-motion: reduce){.m3 *,.m3 *::before,.m3 *::after{animation:none!important}}
</style>
