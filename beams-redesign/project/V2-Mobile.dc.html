<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
a{color:#773AED}a:hover{color:#42444C}
.line{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.rise{display:block;animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{transform:translateY(110%)}}
.fade{animation:fade 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.shoot{animation:shoot 3.6s cubic-bezier(.55,0,.25,1) infinite both}
@keyframes shoot{0%{transform:translateX(-100%);opacity:0}12%{opacity:1}55%{transform:translateX(0);opacity:1}63%,100%{transform:translateX(0);opacity:0}}
.cellpulse{animation:cellpulse 3.6s ease-in-out infinite both}
@keyframes cellpulse{0%,48%{background:#D5D7DD;transform:scale(1)}60%{background:#37BFEF;transform:scale(1.7);box-shadow:0 0 14px rgba(55,191,239,.85)}85%,100%{background:#86C5FF;transform:scale(1.1)}}
.ping{animation:ping 3.6s cubic-bezier(0,0,.2,1) infinite both}
@keyframes ping{0%,52%{transform:translate(-50%,-50%) scale(.15);opacity:0}58%{opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){.mob *{animation:none!important}}
</style>
</helmet>
<div class="mob" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FFFFFF; color: #42444C; font-family: Jost, system-ui, sans-serif; display: flex; flex-direction: column">

<nav aria-label="Navigation principale" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #ECEEF2">

<button type="button" aria-label="Ouvrir le menu" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E1E3E8; background: #FFFFFF; color: #42444C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 6h12M3 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
</button>
</nav>

<div style="padding: 26px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div class="fade" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border-radius: 999px; background: #F4F6F9; border: 1px solid #E6E8EE; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #37BFEF; font-size: 13px; font-weight: 700; text-transform: none">β</span>TRIOP · sonde peropératoire
</div>
<h1 style="margin: 0; font-size: 50px; line-height: 0.92; letter-spacing: -0.035em; font-weight: 800">
<span class="line"><span class="rise" style="animation-delay: 0.05s">Retirer toute</span></span>
<span class="line"><span class="rise" style="animation-delay: 0.16s">la tumeur.</span></span>
<span class="line"><span class="rise" style="animation-delay: 0.27s; font-weight: 200; color: #773AED">Rien de plus.</span></span>
</h1>
<p class="fade" style="margin: 0; font-size: 16px; line-height: 1.55; color: #5A5C66; animation-delay: 0.45s">TRIOP détecte en temps réel les cellules tumorales que l’œil ne voit pas.</p>
</div>

<div style="flex: 1 1 auto; min-height: 0; padding: 20px 20px 0">
<div class="fade" role="img" aria-label="Animation : des faisceaux convergent vers un amas de cellules" style="position: relative; height: 100%; border-radius: 28px; background: #F4F6F9; border: 1px solid #E6E8EE; overflow: hidden; animation-delay: 0.3s">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="12"><span class="{{d.cls}}" style="{{d.style}}"></span></sc-for>
<span class="ping" style="position: absolute; left: 66%; top: 50%; width: 180px; height: 180px; border-radius: 50%; border: 1.5px solid #37BFEF; transform: translate(-50%, -50%)"></span>
<div class="shoot" style="position: absolute; left: 0; top: 50%; width: 60%; height: 20px; margin-top: -10px; display: flex; justify-content: flex-end"><svg viewBox="0 54.33 105.6 14.92" width="140" height="20" aria-hidden="true" style="filter: drop-shadow(0 0 8px rgba(55, 191, 239, 0.8))"><path fill="#37BFEF" d="{{beam}}"></path></svg></div>
<div class="shoot" style="position: absolute; left: 0; top: 38%; width: 62%; height: 20px; margin-top: -10px; display: flex; justify-content: flex-end; animation-delay: 0.15s"><svg viewBox="0 54.33 105.6 14.92" width="96" height="14" aria-hidden="true"><path fill="#773AED" d="{{beam}}"></path></svg></div>
</div>
</div>

<div style="padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 10px">
<a href="#demo" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 999px; background: #773AED; color: #FFFFFF; font-size: 16px; font-weight: 500; text-decoration: none">Essayer la détection
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12M10 4l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<a href="#contact" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; border: 1px solid #D5D7DD; color: #42444C; font-size: 16px; font-weight: 500; text-decoration: none">Partenariats cliniques</a>
</div>

</div>
